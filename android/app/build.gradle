plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (GitHub Actions secrets).
// Without them the release build is signed with the debug key: installable for testing, not for Google Play.
def ks = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.gorezone.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.gorezone.game'
        minSdk 24
        targetSdk 36
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName project.findProperty('versionName') ?: '1.0'
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the game files are copied into src/main/assets by the build workflow
    androidResources {
        noCompress += ['js', 'html']
    }
}
